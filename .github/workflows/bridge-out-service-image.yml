name: Bridge-out service image

# Builds the bridge-out (return) service image from prover/Dockerfile and
# publishes it to ghcr.io/unicitynetwork/bridge-out-service, so a deployment
# pulls a pinned image instead of building it on its own host.
#
# The build is the check: the host stage fails unless the pinned guest ELF has
# its committed sha256 and derives the verifying key the GUEST_DEPLOYMENT record
# pins, and it runs check-vectors. Pull requests, and manual runs on any ref
# other than main or a v* tag, build the image the same way but do not push it.
#
# Tags:
# - `<7-character commit sha>`, what a deployment pins. Written ONCE, from main:
#   a re-run or a later build of the same commit (different labels, unpinned base
#   images) must never replace the image a deployment already runs.
# - `latest`, moved with each main build that publishes.
# - `<version>` for a v* tag; a tag build pushes only that.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - prover/**
      - protocol/**
      - deployments/**
      - contracts/tron/**
      - bft-trustbase.testnet2.json
      - .dockerignore
      - .github/workflows/bridge-out-service-image.yml
  pull_request:
    paths:
      - prover/**
      - protocol/**
      - deployments/**
      - contracts/tron/**
      - bft-trustbase.testnet2.json
      - .dockerignore
      - .github/workflows/bridge-out-service-image.yml
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes a build in
# progress; tags and main each finish what they started.
concurrency:
  group: bridge-out-service-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/unicitynetwork/bridge-out-service
  # Publishing is decided by the ref, not by what started the run: a manual run
  # on another branch only builds.
  PUBLISH_REF: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
  ON_MAIN: ${{ github.ref == 'refs/heads/main' }}

jobs:
  image:
    # GitHub-hosted: the org's self-hosted pool does not take public repositories.
    runs-on: ubuntu-latest
    # A cold build compiles the SP1 host and service in release; the cache below
    # shortens later ones.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      # The SP1 image, the Rust and Go toolchains and a cold release target do not
      # fit the runner's free disk otherwise.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        if: env.PUBLISH_REF == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The sha tag is write-once: if this commit is already published (a re-run,
      # a manual run on main), the run builds but pushes nothing. Only a confirmed
      # "not found" lets it publish -- GHCR answers that for a missing tag and for
      # a package that does not exist yet -- and any other failure (network, auth)
      # stops the run rather than risk replacing a pinned image.
      - name: Is this commit already published?
        id: published
        if: env.PUBLISH_REF == 'true' && env.ON_MAIN == 'true'
        run: |
          ref="${IMAGE}:${GITHUB_SHA::7}"
          if out="$(docker buildx imagetools inspect "$ref" 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$ref is already published; it is never replaced" >> "$GITHUB_STEP_SUMMARY"
          elif printf '%s\n' "$out" | grep -q ': not found$'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            printf 'cannot tell whether %s is published:\n%s\n' "$ref" "$out" >&2
            exit 1
          fi

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # latest=auto would also put `latest` on a v* tag build; it stays main's.
          flavor: latest=false
          tags: |
            type=sha,prefix=,format=short,enable=${{ env.ON_MAIN == 'true' }}
            type=raw,value=latest,enable=${{ env.ON_MAIN == 'true' }}
            type=semver,pattern={{version}}

      - name: Build (and push from main or a v* tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: prover/Dockerfile
          # The guest stage downloads cargo-prove for linux_amd64.
          platforms: linux/amd64
          push: ${{ env.PUBLISH_REF == 'true' && steps.published.outputs.exists != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The tags come in through the environment, not pasted into the script:
      # a tag name is pushed by a user and is not shell-safe text.
      - name: Report the published image
        if: env.PUBLISH_REF == 'true' && steps.published.outputs.exists != 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$TAGS" | while IFS= read -r tag; do
            [ -n "$tag" ] && printf -- '- %s\n' "$tag"
          done >> "$GITHUB_STEP_SUMMARY"
