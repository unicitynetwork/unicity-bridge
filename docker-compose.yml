services:
  return-service:
    build:
      context: .
      dockerfile: prover/Dockerfile
    image: bridge-return-service
    container_name: bridge-return-service
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      BRIDGE_RETURN_PROVE_MODE: ${BRIDGE_RETURN_PROVE_MODE:-precheck_only}
      BRIDGE_RETURN_MAX_BATCH_SIZE: ${BRIDGE_RETURN_MAX_BATCH_SIZE:-8}
      BRIDGE_RETURN_IDLE_WAIT_SECS: ${BRIDGE_RETURN_IDLE_WAIT_SECS:-0}
      BRIDGE_RETURN_MAX_ATTEMPTS: ${BRIDGE_RETURN_MAX_ATTEMPTS:-5}
      BRIDGE_RETURN_RETRY_BASE_SECS: ${BRIDGE_RETURN_RETRY_BASE_SECS:-60}
      SP1_WORKER_NUM_CORE_WORKERS: ${SP1_WORKER_NUM_CORE_WORKERS:-1}
      SP1_WORKER_NUM_SETUP_WORKERS: ${SP1_WORKER_NUM_SETUP_WORKERS:-1}
      SP1_WORKER_NUM_SPLICING_WORKERS: ${SP1_WORKER_NUM_SPLICING_WORKERS:-1}
      SP1_WORKER_NUM_PREPARE_REDUCE_WORKERS: ${SP1_WORKER_NUM_PREPARE_REDUCE_WORKERS:-1}
      SP1_WORKER_NUM_RECURSION_EXECUTOR_WORKERS: ${SP1_WORKER_NUM_RECURSION_EXECUTOR_WORKERS:-1}
      SP1_WORKER_NUM_RECURSION_PROVER_WORKERS: ${SP1_WORKER_NUM_RECURSION_PROVER_WORKERS:-1}
      SP1_WORKER_NUM_DEFERRED_WORKERS: ${SP1_WORKER_NUM_DEFERRED_WORKERS:-1}
      GOMEMLIMIT: ${GOMEMLIMIT:-14GiB}
      GOGC: ${GOGC:-50}
      RUST_LOG: ${RUST_LOG:-bridge_return_service=info,tower_http=info,sp1_prover=info,sp1_sdk=info}
      BRIDGE_DEPLOYMENT_CONFIG: /app/deployments/${BRIDGE_DEPLOYMENT:-sepolia/sepolia-usdc.json}
      BRIDGE_RELAYER: ${BRIDGE_RELAYER:-relayer-eth.js}
      UNICITY_GATEWAY: ${UNICITY_GATEWAY:-https://gateway.testnet2.unicity.network}
      ETH_SK: ${ETH_SK:-}
      ETH_VAULT: ${ETH_VAULT:-}
      ETH_VAULT_DEPLOY_BLOCK: ${ETH_VAULT_DEPLOY_BLOCK:-}
      ETH_RPC_URL: ${ETH_RPC_URL:-https://sepolia.gateway.tenderly.co}
      ETH_CHAIN_ID: ${ETH_CHAIN_ID:-11155111}
      TRON_SK: ${TRON_SK:-}
      TRON_VAULT: ${TRON_VAULT:-}
      TRON_RPC_URL: ${TRON_RPC_URL:-https://nile.trongrid.io}
    volumes:
      - sp1-artifacts:/root/.sp1
      - return-data:/data
volumes:
  sp1-artifacts:
  return-data:
