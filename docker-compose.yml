services:
  return-service:
    build:
      context: .
      dockerfile: prover/Dockerfile
    image: bridge-return-service
    container_name: bridge-return-service
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      BRIDGE_RETURN_PROVE_MODE: ${BRIDGE_RETURN_PROVE_MODE:-precheck_only}
      BRIDGE_RETURN_MAX_BATCH_SIZE: ${BRIDGE_RETURN_MAX_BATCH_SIZE:-8}
      BRIDGE_RETURN_IDLE_WAIT_SECS: ${BRIDGE_RETURN_IDLE_WAIT_SECS:-0}
      BRIDGE_DEPLOYMENT_CONFIG: /app/deployments/nile/${BRIDGE_DEPLOYMENT:-nile-usdt-v2.json}
      UNICITY_GATEWAY: ${UNICITY_GATEWAY:-https://gateway.testnet2.unicity.network}
      TRON_SK: ${TRON_SK:-}
      TRON_VAULT: ${TRON_VAULT:-}
      TRON_RPC_URL: ${TRON_RPC_URL:-https://nile.trongrid.io}
      TRON_GRID_URL: ${TRON_RPC_URL:-https://nile.trongrid.io}
    volumes:
      - sp1-artifacts:/root/.sp1
      - return-data:/data
volumes:
  sp1-artifacts:
  return-data:
